<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f9f1d3">
  <title>Admin — JRENGS!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('jrengs_theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="admin">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>

<div class="checker" aria-hidden="true"></div>

<!-- ============ LOGIN ============ -->
<main class="login-wrap" id="login-view">
  <button class="icon-btn theme-corner" type="button" data-theme-toggle aria-label="Ganti mode tampilan">
    <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
  </button>

  <div class="login-card">
    <a class="logo" href="index.html" aria-label="JRENGS — ke situs">JRENGS!</a>
    <h1>Admin Login</h1>
    <p class="sub">Masuk untuk melihat dan mengelola pesanan.</p>

    <form id="login-form" novalidate autocomplete="off">
      <div class="field">
        <label for="l-user">Username</label>
        <input id="l-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <div class="pw-wrap">
          <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
          <button class="pw-toggle" type="button" id="pw-toggle" aria-label="Tampilkan password" aria-pressed="false">Lihat</button>
        </div>
      </div>
      <p class="login-err" id="login-err" role="alert"></p>
      <button class="btn btn--block" type="submit">Masuk</button>
    </form>

    <a class="back-link" href="index.html">← Kembali ke situs</a>
  </div>
</main>

<!-- ============ DASHBOARD ============ -->
<div id="dash-view" hidden>
  <header class="admin-bar">
    <div class="container">
      <a class="logo" href="index.html" aria-label="JRENGS — ke situs">JRENGS!</a>
      <span class="pill pill--green">Admin</span>
      <span class="spacer"></span>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Ganti mode tampilan">
        <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
      <a class="btn btn--sm btn--cream" href="index.html">Lihat situs</a>
      <button class="btn btn--sm" type="button" id="logout">Keluar</button>
    </div>
  </header>

  <main class="container dash">
    <h1>Pesanan Masuk</h1>

    <div class="stats" id="stats"></div>

    <section class="prep" id="prep" aria-label="Rekap yang perlu disiapkan"></section>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Cari nama, nomor, atau no. pesanan…" aria-label="Cari pesanan">
      <div class="chips" id="chips" role="group" aria-label="Filter status"></div>
      <button class="btn btn--sm btn--green" type="button" id="export">Ekspor CSV</button>
    </div>

    <div class="orders" id="orders" aria-live="polite"></div>
  </main>
</div>

<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
